version: '3.8'
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
  orchestrator:
    image: agentyard/orchestrator:latest
    ports:
    - 8080:8080
    environment:
      YARD_SYSTEM_ID: a3454533-cca7-4537-aae1-4548e9376d83
      YARD_TRANSPORT: http
      YARD_REDIS_URL: redis://redis:6379
      YARD_ENGINE_TYPE: chain_executor
      YARD_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      YARD_GLOBAL_TOKEN: dev-token
    depends_on:
      redis:
        condition: service_healthy
  invoice-processor-agent:
    image: agentyard-invoice-processor-agent:latest
    environment:
      YARD_TRANSPORT: http
      YARD_SYSTEM_ID: a3454533-cca7-4537-aae1-4548e9376d83
      YARD_NODE_ID: n1
      YARD_REDIS_URL: redis://redis:6379
      YARD_PORT: '9000'
      YARD_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      YARD_LLM_PROVIDER: bedrock
      YARD_AUTO_REGISTER: 'false'
      YARD_MEMORY: shared_bus
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"
      interval: 10s
      timeout: 5s
      retries: 3
    configs:
    - source: yard_cfg_n1
      target: /yard/config.yaml
  fraud-detector-agent:
    image: agentyard-fraud-detector-agent:latest
    environment:
      YARD_TRANSPORT: http
      YARD_SYSTEM_ID: a3454533-cca7-4537-aae1-4548e9376d83
      YARD_NODE_ID: n2
      YARD_REDIS_URL: redis://redis:6379
      YARD_PORT: '9000'
      YARD_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      YARD_LLM_PROVIDER: bedrock
      YARD_AUTO_REGISTER: 'false'
      YARD_MEMORY: shared_bus
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"
      interval: 10s
      timeout: 5s
      retries: 3
    configs:
    - source: yard_cfg_n2
      target: /yard/config.yaml
  report-generator-agent:
    image: agentyard-report-generator-agent:latest
    environment:
      YARD_TRANSPORT: http
      YARD_SYSTEM_ID: a3454533-cca7-4537-aae1-4548e9376d83
      YARD_NODE_ID: n3
      YARD_REDIS_URL: redis://redis:6379
      YARD_PORT: '9000'
      YARD_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      YARD_LLM_PROVIDER: bedrock
      YARD_AUTO_REGISTER: 'false'
      YARD_MEMORY: shared_bus
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"
      interval: 10s
      timeout: 5s
      retries: 3
    configs:
    - source: yard_cfg_n3
      target: /yard/config.yaml
networks:
  default:
    name: yard-invoice-fraud-report-pipeline
configs:
  yard_cfg_n1:
    file: ./yard-config-n1.yaml
  yard_cfg_n2:
    file: ./yard-config-n2.yaml
  yard_cfg_n3:
    file: ./yard-config-n3.yaml
